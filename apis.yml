description: 'Taysha Gene Therapies is a clinical-stage biotechnology company (Dallas, TX with a laboratory
  in Morrisville, NC) developing AAV-based gene therapies for rare monogenic diseases of the central nervous
  system. Its lead program, TSHA-102, targets Rett syndrome and has completed dosing in the REVEAL pivotal
  trial. The company operates as a therapeutics developer and publishes no public developer API, documentation
  portal, or technical integration surface; it was surfaced as a GV portfolio company and added to the API
  Evangelist network as an enrichment lead.'
